services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9094}:9094"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  product-catalog:
    build: ./product-catalog
    ports:
      - "${CATALOG_PORT:-8081}:8081"

  customer:
    build: ./customer
    ports:
      - "${CUSTOMER_PORT:-8082}:8082"

  order-worker:
    build:
      context: .
      dockerfile: order-worker/Dockerfile
    ports:
      - "${WORKER_PORT:-8083}:8083"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-orders}
      KAFKA_DLT_TOPIC: ${KAFKA_DLT_TOPIC:-orders.DLT}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-order-worker}
      WORKER_MAX_RETRIES: ${WORKER_MAX_RETRIES:-3}
      MONGODB_URI: mongodb://mongo:27017/${MONGO_DB:-orders}
      REDIS_URL: redis://redis:6379
      CATALOG_BASE_URL: http://product-catalog:8081
      CUSTOMER_BASE_URL: http://customer:8082
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      product-catalog:
        condition: service_started
      customer:
        condition: service_started
