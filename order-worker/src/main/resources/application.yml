spring:
  application:
    name: order-worker
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/orders}

server:
  port: 8083

enrichment:
  catalog-base-url: ${CATALOG_BASE_URL:http://localhost:8081}
  customer-base-url: ${CUSTOMER_BASE_URL:http://localhost:8082}
  request-timeout: 2s

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  topic: ${KAFKA_TOPIC:orders}
  dlt-topic: ${KAFKA_DLT_TOPIC:orders.DLT}
  group-id: ${KAFKA_GROUP_ID:order-worker}
  max-retries: ${WORKER_MAX_RETRIES:3}

redisson:
  url: ${REDIS_URL:redis://localhost:6379}
  lock-wait-time: 3s
  lock-lease-time: 30s
  failed-ttl: 7d

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.grupomariposa.orderworker: INFO
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
